[package]
name = "annoterm"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first terminal Markdown review and editing"
license = "MIT"
repository = "https://github.com/filipgutica/annoterm"
homepage = "https://github.com/filipgutica/annoterm"

[dependencies]
anyhow = "1.0"
atomic-write-file = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4.3"
markdown = "1.0"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "3.2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
uuid = { version = "1.18", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
lto = "thin"
